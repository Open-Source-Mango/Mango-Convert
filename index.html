<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Mango Convert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: transparent;
    }

    .app-window {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, rgba(45, 20, 4, 0.88) 0%, rgba(23, 10, 2, 0.92) 60%, rgba(13, 5, 1, 0.96) 100%);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 140, 0, 0.28);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 140, 0, 0.18);
      background: rgba(14, 6, 1, 0.55);
      flex-shrink: 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .titlebar-logo {
      width: 20px;
      height: 20px;
    }

    .titlebar-text {
      font-size: 12px;
      font-weight: 700;
      color: #ffb703;
      letter-spacing: 0.5px;
    }

    .titlebar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 28px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: #d4a373;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .titlebar-btn:hover {
      background: rgba(255, 140, 0, 0.25);
      color: #fff;
    }

    .titlebar-btn.close:hover {
      background: #e63900;
      color: #fff;
    }

    .content-area {
      padding: 22px 34px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: flex-start;
      color: #fff4ed;
    }

    .header-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .header-logo {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 4px 12px rgba(255, 140, 0, 0.5));
    }

    h1 {
      background: linear-gradient(90deg, #ffe033 0%, #ff8c00 50%, #e63900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 12px;
      color: #d4a373;
      margin-bottom: 16px;
    }

    .drop-zone {
      border: 2px dashed rgba(255, 140, 0, 0.35);
      background: rgba(18, 9, 2, 0.5);
      border-radius: 14px;
      padding: 20px 16px;
      cursor: pointer;
      transition: 0.25s ease;
      margin-bottom: 14px;
    }

    .drop-zone:hover, .drop-zone.active {
      border-color: #ff8c00;
      background: rgba(255, 140, 0, 0.12);
      box-shadow: 0 0 24px rgba(255, 140, 0, 0.25);
    }

    .drop-zone strong {
      display: block;
      font-size: 14px;
      color: #fff;
      word-break: break-all;
    }

    .drop-zone span {
      display: block;
      font-size: 12px;
      color: #b08968;
      margin-top: 4px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #ffb703;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    select, button.convert-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    select {
      background: rgba(20, 10, 3, 0.7);
      color: #fff4ed;
      border: 1px solid rgba(255, 140, 0, 0.3);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: #ff8c00;
    }

    select:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    optgroup {
      background: #140801;
      color: #ff8c00;
    }

    option {
      background: #1c0e04;
      color: #fff4ed;
    }

    button.convert-btn {
      background: linear-gradient(135deg, #ffe033 0%, #ff8c00 50%, #e63900 100%);
      color: #1a0800;
      border: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(230, 57, 0, 0.35);
    }

    button.convert-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(230, 57, 0, 0.5);
    }

    button.convert-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.6);
    }

    .progress-container {
      display: none;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff8c00, #ffe033);
      transition: width 0.2s ease;
    }

    .status-box {
      margin-top: 10px;
      font-size: 12px;
      color: #d4a373;
      min-height: 20px;
      word-break: break-word;
    }

    /* Ekran startowy (Splash Screen) */
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(45, 20, 4, 0.98) 0%, rgba(13, 5, 1, 0.99) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      animation: pulseGlow 1.8s infinite alternate ease-in-out;
    }

    .splash-title {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffe033 0%, #ff8c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 140, 0, 0.18);
      border-top: 3px solid #ff8c00;
      border-radius: 50%;
      margin-top: 20px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.4)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 24px rgba(255, 140, 0, 0.85)); }
    }

    .splash-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="app-window">
    <div id="splash" class="splash-overlay">
      <img src="icon.svg" alt="Mango" class="splash-logo">
      <div class="splash-title">Mango Convert</div>
      <div class="splash-spinner"></div>
    </div>

    <div class="titlebar">
      <div class="titlebar-left">
        <img src="icon.svg" class="titlebar-logo" alt="Logo">
        <span class="titlebar-text">Mango Convert</span>
      </div>
      <div class="titlebar-controls">
        <button id="min-btn" class="titlebar-btn" title="Minimalizuj">−</button>
        <button id="close-btn" class="titlebar-btn close" title="Schowaj do zasobnika">✕</button>
      </div>
    </div>

    <div class="content-area">
      <div class="header-branding">
        <img src="icon.svg" alt="Mango Logo" class="header-logo">
        <h1>Mango Convert</h1>
      </div>
      <p class="subtitle">Wideo • Audio • Grafika • Wektory (SVG) • Ikony</p>

      <div class="drop-zone" id="drop-zone">
        <strong id="file-name">Wybierz lub upuść plik tutaj</strong>
        <span>Wideo, Muzyka, Grafiki, SVG, Ikony ICO</span>
      </div>

      <div class="input-group">
        <label>Docelowy format i jakość:</label>
        <select id="target-format" disabled>
          <option value="">Najpierw wskaż plik...</option>
        </select>
      </div>

      <div class="input-group" id="gpu-group" style="display: none;">
        <label>Akceleracja kodowania wideo:</label>
        <select id="encoder-select">
          <option value="nvenc">NVIDIA NVENC (Akceleracja sprzętowa GPU)</option>
          <option value="cpu">CPU - x264 (Wysoka kompatybilność procesora)</option>
          <option value="amf">AMD AMF (Karty Radeon)</option>
          <option value="qsv">Intel QSV (Intel QuickSync)</option>
          <option value="mac">Apple VideoToolbox (Mac Silicon M-Series)</option>
        </select>
      </div>

      <button id="convert-btn" class="convert-btn" disabled>Rozpocznij Konwersję</button>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div id="status" class="status-box">Gotowy do pracy</div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) splash.classList.add('fade-out');
      }, 950);
    });
  </script>
</body>
</html>
